name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8
      
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      
      - name: Build API
        run: |
          cd apps/api
          pnpm build || echo "Build skipped"
      
      - name: Lint
        run: pnpm lint || echo "Lint skipped"
      
      - name: Test
        run: pnpm test || echo "Test skipped"
        
